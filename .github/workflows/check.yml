name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          curl --fail --location --silent --show-error \
            https://github.com/otter-sec/anchor/releases/download/v1.2.1/anchor-1.2.1-x86_64-unknown-linux-gnu \
            -o "$RUNNER_TEMP/anchor"
          chmod 755 "$RUNNER_TEMP/anchor"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          curl --fail --silent --show-error https://release.anza.xyz/v4.3.0/install \
            | sh -s -- --no-modify-path v4.3.0
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: anchor build
      - run: git diff --exit-code -- Cargo.lock
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '26.6.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run idl
      - run: git diff --exit-code -- idl
      - run: npm run typecheck
      - run: npm test
      - name: Run the scripted demo against a local validator
        shell: bash
        run: |
          set -euo pipefail
          npm run validator -- --quiet > "$RUNNER_TEMP/validator.log" 2>&1 &
          validator_pid=$!
          trap 'kill "$validator_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run bootstrap
          npm run demo
          npm run verify:demo
          KEEPER_KEYPAIR=.local/localnet/keeper-keypair.json npm run keeper
